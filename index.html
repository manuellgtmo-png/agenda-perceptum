<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Médica Privada | Perceptum</title>
    <!-- FontAwesome para íconos -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- EmailJS SDK para envío de correos/alertas -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        :root {
            --primary: #005f73;
            --secondary: #0A9396;
            --accent: #E9D8A6;
            --danger: #CA6702;
            --dark: #1D2D44;
            --bg: #F4F6F8;
            --card-bg: #FFFFFF;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; background-color: var(--bg); height: 100vh; overflow: hidden; }

        /* Login Modal / Overlay */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 95, 115, 0.95);
            display: flex; justify-content: center; align-items: center; z-index: 10000;
        }
        .login-box {
            background: white; padding: 40px; border-radius: 12px; text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 90%; max-width: 380px;
        }
        .login-box h2 { color: var(--primary); margin-bottom: 20px; }
        .login-box input {
            width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc;
            border-radius: 6px; font-size: 1rem; text-align: center;
        }
        .login-box button {
            width: 100%; padding: 12px; background: var(--secondary); color: white;
            border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem;
        }

        /* Layout Principal estilo Reservo */
        .app-container { display: flex; height: 100vh; }

        /* Sidebar */
        .sidebar {
            width: 260px; background: var(--dark); color: white; padding: 25px 20px;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .brand { font-size: 1.2rem; font-weight: bold; letter-spacing: 1px; margin-bottom: 30px; display: flex; align-items: center; gap: 10px; }
        .btn-new {
            background: var(--secondary); color: white; border: none; padding: 14px;
            border-radius: 8px; font-weight: bold; cursor: pointer; display: flex;
            align-items: center; justify-content: center; gap: 10px; width: 100%; font-size: 1rem;
        }

        /* Main Content */
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .header h1 { margin: 0; color: var(--dark); font-size: 1.8rem; }
        .date-picker { padding: 10px 15px; border-radius: 8px; border: 1px solid #ccc; font-size: 1rem; background: white; }

        /* Contenedor de Citas */
        .agenda-list { display: flex; flex-direction: column; gap: 15px; }
        .appointment-card {
            background: white; border-radius: 10px; padding: 20px; display: flex;
            justify-content: space-between; align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 6px solid var(--primary);
        }
        .time-badge { background: #eef9f9; color: var(--primary); padding: 6px 12px; border-radius: 6px; font-weight: bold; font-size: 0.9rem; }
        .patient-info h3 { margin: 5px 0; color: var(--dark); }
        .patient-info p { margin: 3px 0; color: #666; font-size: 0.9rem; }
        .actions { display: flex; gap: 10px; }
        .btn-action { border: none; background: #f0f0f0; padding: 10px 12px; border-radius: 6px; cursor: pointer; color: #444; }
        .btn-action:hover { background: #e0e0e0; }

        /* Modal para Nueva Cita */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 9999;
        }
        .modal-content { background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 500px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <!-- Pantalla de Login -->
    <div id="login-overlay">
        <div class="login-box">
            <h2><i class="fas fa-user-shield"></i> Acceso Privado</h2>
            <p style="color: #666; font-size: 0.9rem; margin-bottom: 20px;">Agenda Médica Perceptum</p>
            <input type="password" id="access-code" placeholder="Ingrese su contraseña">
            <button onclick="checkAccess()"><i class="fas fa-key"></i> Entrar</button>
            <p id="login-error" style="color: red; font-size: 0.85rem; margin-top: 10px; display: none;">Contraseña incorrecta</p>
        </div>
    </div>

    <!-- Aplicación Principal -->
    <div class="app-container">
        <aside class="sidebar">
            <div>
                <div class="brand"><i class="fas fa-clinic-medical"></i> PERCEPTUM</div>
                <button class="btn-new" onclick="openAppointmentModal()"><i class="fas fa-plus-circle"></i> Agendar Paciente</button>
            </div>
            <div style="font-size: 0.8rem; color: #aaa;">
                <p>Acceso Exclusivo Dirección</p>
            </div>
        </aside>

        <main class="main-content">
            <div class="header">
                <h1>Gestión de Citas</h1>
                <input type="date" id="agenda-date" class="date-picker" onchange="renderAppointments()">
            </div>

            <div class="agenda-list" id="appointments-container">
                <!-- Las citas se cargarán dinámicamente aquí -->
            </div>
        </main>
    </div>

    <!-- Modal Formulario de Agendamiento -->
    <div class="modal" id="appointment-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="margin: 0; color: var(--primary);"><i class="fas fa-calendar-plus"></i> Nueva Cita</h3>
                <i class="fas fa-times" style="cursor: pointer;" onclick="closeModal()"></i>
            </div>
            <form id="appointment-form" onsubmit="saveAppointment(event)">
                <div class="form-group">
                    <label>Nombre del Paciente *</label>
                    <input type="text" id="patient-name" required placeholder="Ej. Cristian Díaz">
                </div>
                <div class="form-group">
                    <label>Correo del Paciente (Para alerta)</label>
                    <input type="email" id="patient-email" placeholder="paciente@email.com">
                </div>
                <div class="form-group">
                    <label>Prestación *</label>
                    <select id="service-type" required>
                        <option value="Consulta Oftalmológica">Consulta Oftalmológica</option>
                        <option value="Consulta Fonoaudiológica">Consulta Fonoaudiológica</option>
                        <option value="Terapia de Estrabismo / Visión">Terapia de Estrabismo / Visión</option>
                        <option value="Terapia Vestibular">Terapia Vestibular</option>
                        <option value="Atención a Domicilio">Atención a Domicilio</option>
                    </select>
                </div>
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Hora Inicio *</label>
                        <input type="time" id="start-time" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Duración (min) *</label>
                        <select id="duration" required>
                            <option value="30">30 min</option>
                            <option value="45" selected>45 min</option>
                            <option value="60">60 min</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Observaciones / Notas Clínicas</label>
                    <textarea id="observations" rows="2" placeholder="Motivo de consulta o notas internas..."></textarea>
                </div>
                <button type="submit" class="btn-new" style="width: 100%; border-radius: 6px;"><i class="fas fa-save"></i> Guardar Cita</button>
            </form>
        </div>
    </div>

    <script>
        // Configuración de EmailJS (Reemplazar con tus claves reales de EmailJS)
        emailjs.init("YOUR_PUBLIC_KEY"); 

        const DEFAULT_PASS = "Perceptum2026"; // Contraseña por defecto

        // Inicializar fecha
        document.getElementById('agenda-date').valueAsDate = new Date();

        function checkAccess() {
            const inputPass = document.getElementById('access-code').value;
            if(inputPass === DEFAULT_PASS) {
                document.getElementById('login-overlay').style.display = 'none';
                renderAppointments();
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        function openAppointmentModal() {
            document.getElementById('appointment-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('appointment-modal').style.display = 'none';
        }

        function getAppointments() {
            return JSON.parse(localStorage.getItem('perceptum_appointments')) || [];
        }

        function saveAppointment(e) {
            e.preventDefault();
            const date = document.getElementById('agenda-date').value;
            const newAppointment = {
                id: Date.now(),
                date: date,
                name: document.getElementById('patient-name').value,
                email: document.getElementById('patient-email').value,
                service: document.getElementById('service-type').value,
                time: document.getElementById('start-time').value,
                duration: document.getElementById('duration').value,
                notes: document.getElementById('observations').value
            };

            const appointments = getAppointments();
            appointments.push(newAppointment);
            localStorage.setItem('perceptum_appointments', JSON.stringify(appointments));

            closeModal();
            document.getElementById('appointment-form').reset();
            renderAppointments();
        }

        function deleteAppointment(id) {
            if(confirm("¿Seguro que deseas eliminar esta cita?")) {
                let appointments = getAppointments();
                appointments = appointments.filter(app => app.id !== id);
                localStorage.setItem('perceptum_appointments', JSON.stringify(appointments));
                renderAppointments();
            }
        }

        function sendEmailAlert(email, name, date, time, service) {
            if(!email) {
                alert("Esta cita no tiene un correo asignado.");
                return;
            }
            
            alert(`Simulando envío de correo de recordatorio a: ${email}`);
            
            /* Código listo para activar con EmailJS:
            emailjs.send("YOUR_SERVICE_ID", "YOUR_TEMPLATE_ID", {
                to_email: email,
                patient_name: name,
                date: date,
                time: time,
                service: service
            }).then(() => alert("¡Recordatorio enviado con éxito!"))
              .catch(err => alert("Error al enviar correo: " + JSON.stringify(err)));
            */
        }

        function renderAppointments() {
            const selectedDate = document.getElementById('agenda-date').value;
            const appointments = getAppointments().filter(app => app.date === selectedDate);
            const container = document.getElementById('appointments-container');

            if(appointments.length === 0) {
                container.innerHTML = `<div style="text-align: center; padding: 40px; color: #888;">
                    <i class="far fa-calendar-times" style="font-size: 3rem; margin-bottom: 10px;"></i>
                    <p>No hay citas agendadas para esta fecha.</p>
                </div>`;
                return;
            }

            // Ordenar por hora
            appointments.sort((a,b) => a.time.localeCompare(b.time));

            container.innerHTML = appointments.map(app => `
                <div class="appointment-card">
                    <div>
                        <span class="time-badge"><i class="far fa-clock"></i> ${app.time} hrs (${app.duration} min)</span>
                        <h3 style="margin-top: 8px;">${app.name}</h3>
                        <p><strong>Prestación:</strong> ${app.service}</p>
                        ${app.notes ? `<p style="color: #777;"><em>Obs: ${app.notes}</em></p>` : ''}
                    </div>
                    <div class="actions">
                        <button class="btn-action" title="Enviar Recordatorio por Correo" onclick="sendEmailAlert('${app.email}', '${app.name}', '${app.date}', '${app.time}', '${app.service}')">
                            <i class="fas fa-envelope" style="color: var(--primary);"></i>
                        </button>
                        <button class="btn-action" title="Eliminar Cita" onclick="deleteAppointment(${app.id})">
                            <i class="fas fa-trash-alt" style="color: var(--danger);"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
