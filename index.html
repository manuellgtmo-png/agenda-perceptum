<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Médica Privada | Perceptum</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --primary: #00B4D8;
            --secondary: #0077B6;
            --accent: #90E0EF;
            --danger: #E63946;
            --dark-bg: #0F172A;
            --card-bg: #1E293B;
            --input-bg: #334155;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --border: #334155;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; background-color: var(--dark-bg); color: var(--text-main); height: 100vh; overflow: hidden; }

        /* Login Overlay */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.98);
            display: flex; justify-content: center; align-items: center; z-index: 10000;
        }
        .login-box {
            background: var(--card-bg); padding: 40px; border-radius: 16px; text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6); width: 90%; max-width: 400px; border: 1px solid var(--border);
        }
        
        /* Ajuste circular perfecto para el logo */
        .login-logo { 
            width: 120px; 
            height: 120px; 
            margin: 0 auto 15px auto; 
            object-fit: cover; 
            border-radius: 50%; 
            display: block;
            border: 2px solid var(--primary);
        }
        .brand-logo { 
            width: 100px; 
            height: 100px; 
            object-fit: cover; 
            border-radius: 50%; 
            border: 2px solid var(--primary);
            margin: 0 auto;
            display: block;
        }

        .login-box input {
            width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid var(--border);
            border-radius: 8px; font-size: 1rem; text-align: center; background: var(--input-bg); color: white;
        }
        .login-box button {
            width: 100%; padding: 12px; background: var(--secondary); color: white;
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem;
        }

        /* App Container */
        .app-container { display: flex; height: 100vh; position: relative; }

        .sidebar-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.7); z-index: 998;
        }

        /* Sidebar deslizable */
        .sidebar {
            position: fixed; top: 0; left: 0; height: 100vh; width: 280px;
            background: #020617; color: white; padding: 25px 20px;
            display: flex; flex-direction: column; justify-content: space-between;
            transition: transform 0.3s ease; z-index: 999; border-right: 1px solid var(--border);
            transform: translateX(-100%);
        }
        .sidebar.active { transform: translateX(0); }
        .sidebar-overlay.active { display: block; }

        .brand-container { text-align: center; margin-bottom: 25px; }

        .profile-selector {
            background: rgba(255, 255, 255, 0.05); padding: 12px; border-radius: 10px; margin-bottom: 20px; border: 1px solid var(--border);
        }
        .profile-selector label { font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 8px; }
        .profile-buttons { display: flex; gap: 8px; }
        .btn-profile {
            flex: 1; padding: 8px; border: 1px solid var(--border); background: transparent;
            color: white; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: all 0.2s;
        }
        .btn-profile.active { background: var(--secondary); border-color: var(--secondary); }

        .btn-new {
            background: var(--secondary); color: white; border: none; padding: 14px;
            border-radius: 8px; font-weight: bold; cursor: pointer; display: flex;
            align-items: center; justify-content: center; gap: 10px; width: 100%; font-size: 0.95rem; transition: background 0.2s;
        }
        .btn-new:hover { background: #005f96; }

        /* Main Content */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; width: 100%; background: var(--dark-bg); }
        
        .header {
            padding: 15px 20px; background: var(--card-bg); border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center; gap: 10px;
        }
        .header-title-container { display: flex; align-items: center; gap: 12px; }
        
        .menu-toggle {
            display: block; background: var(--input-bg); border: 1px solid var(--border);
            padding: 8px 12px; border-radius: 8px; font-size: 1.2rem; color: var(--text-main); cursor: pointer;
        }
        .header h1 { margin: 0; color: var(--text-main); font-size: 1.2rem; display: flex; align-items: center; gap: 8px; }
        .header-controls { display: flex; align-items: center; gap: 10px; }
        .week-picker-btn {
            background: var(--input-bg); border: 1px solid var(--border); padding: 8px 10px;
            border-radius: 8px; font-weight: 600; color: var(--text-main); cursor: pointer; font-size: 0.85rem; color-scheme: dark;
        }

        .sync-badge {
            font-size: 0.75rem; padding: 4px 8px; border-radius: 6px; background: #334155; color: var(--text-muted);
            display: flex; align-items: center; gap: 5px;
        }

        /* Calendar Grid */
        .calendar-wrapper { flex: 1; overflow-y: auto; overflow-x: auto; padding: 15px; }
        
        .weekly-grid {
            display: grid; grid-template-columns: 60px repeat(6, minmax(130px, 1fr)); gap: 1px;
            background: var(--border); border-radius: 12px; overflow: hidden; border: 1px solid var(--border);
            min-width: 800px;
        }

        .grid-header { background: #1E293B; padding: 12px 8px; text-align: center; font-weight: 700; color: var(--text-main); font-size: 0.85rem; }
        .grid-header.time-col { background: #0F172A; color: var(--text-muted); font-size: 0.75rem; display: flex; align-items: center; justify-content: center; }

        .time-slot-label {
            background: var(--card-bg); padding: 10px 4px; text-align: center; font-size: 0.75rem;
            color: var(--text-muted); font-weight: 600; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
        }

        .grid-cell { background: #0F172A; border-top: 1px solid var(--border); min-height: 48px; position: relative; padding: 2px; }
        .grid-cell:hover { background: #1E293B; }

        .slot-card {
            background: #1E293B; border-left: 4px solid var(--primary); padding: 6px;
            border-radius: 6px; font-size: 0.75rem; height: 100%; display: flex; flex-direction: column;
            justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            position: relative; z-index: 2; border: 1px solid var(--border);
        }
        .slot-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
        .slot-time { font-weight: bold; color: var(--primary); font-size: 0.7rem; }
        .slot-patient { font-weight: 700; color: #FFFFFF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .slot-service { color: var(--text-muted); font-size: 0.68rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .slot-actions { display: flex; gap: 4px; margin-top: 4px; }
        .btn-mini { border: none; background: var(--input-bg); padding: 2px 6px; border-radius: 4px; cursor: pointer; font-size: 0.7rem; color: white; text-decoration: none; }
        .btn-mini:hover { background: var(--border); color: var(--primary); }

        .status-badge { font-size: 0.62rem; font-weight: bold; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
        .status-Pendiente { background: #78350F; color: #FDE68A; }
        .status-Confirmado { background: #064E3B; color: #A7F3D0; }
        .status-Reagendado { background: #312E81; color: #C7D2FE; }
        .status-NoAsistio { background: #7F1D1D; color: #FECACA; }

        /* Modal Oscuro */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 9999;
        }
        .modal-content { background: var(--card-bg); color: var(--text-main); padding: 25px; border-radius: 12px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; border: 1px solid var(--border); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: var(--text-muted); font-size: 0.9rem; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem;
            background: var(--input-bg); color: white; color-scheme: dark;
        }
    </style>
</head>
<body>

    <!-- Login -->
    <div id="login-overlay">
        <div class="login-box">
            <img src="logo-perceptum.png.jpg" alt="Perceptum Logo" class="login-logo">
            <h2 style="color: var(--primary); margin: 0 0 5px 0;">PERCEPTUM</h2>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px;">Centro de Salud Especializada</p>
            <input type="password" id="access-code" placeholder="Ingrese su contraseña">
            <button type="button" onclick="checkAccess()"><i class="fas fa-key"></i> Entrar a Agenda</button>
            <p id="login-error" style="color: var(--danger); font-size: 0.85rem; margin-top: 10px; display: none;">Contraseña incorrecta</p>
        </div>
    </div>

    <!-- App Principal -->
    <div class="app-container">
        <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
        
        <aside class="sidebar" id="sidebar">
            <div>
                <div class="brand-container">
                    <img src="logo-perceptum.png.jpg" alt="Perceptum Logo" class="brand-logo">
                </div>

                <div class="profile-selector">
                    <label><i class="fas fa-user-md"></i> Profesional Activo:</label>
                    <div class="profile-buttons">
                        <button type="button" class="btn-profile active" id="btn-manu" onclick="setProfile('Manu')">Manu</button>
                        <button type="button" class="btn-profile" id="btn-ina" onclick="setProfile('Ina')">Ina</button>
                    </div>
                </div>

                <button type="button" class="btn-new" onclick="openAppointmentModal()"><i class="fas fa-plus-circle"></i> Nueva Cita</button>
            </div>
            <div style="font-size: 0.75rem; color: var(--text-muted); text-align: center;">
                <p>Agenda Médica Perceptum v2.0<br>Oftalmología & Fonoaudiología</p>
            </div>
        </aside>

        <main class="main-content">
            <div class="header">
                <div class="header-title-container">
                    <button type="button" class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                    <h1 id="agenda-title"><i class="fas fa-calendar-alt" style="color: var(--primary);"></i> Agenda - Manu</h1>
                </div>
                <div class="header-controls">
                    <span class="sync-badge" id="sync-status"><i class="fas fa-sync fa-spin"></i> Conectando...</span>
                    <input type="date" id="week-selector" class="week-picker-btn" onchange="renderWeeklyGrid()">
                </div>
            </div>

            <div class="calendar-wrapper">
                <div class="weekly-grid" id="grid-container">
                    <!-- Contenido dinámico -->
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Formulario -->
    <div class="modal" id="appointment-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title" style="margin: 0; color: var(--primary);"><i class="fas fa-calendar-plus"></i> Agendar Cita</h3>
                <i class="fas fa-times" style="cursor: pointer;" onclick="closeModal()"></i>
            </div>
            <form id="appointment-form" onsubmit="saveAppointment(event)">
                <input type="hidden" id="editing-id" value="">
                
                <div class="form-group">
                    <label>Profesional Asignado *</label>
                    <select id="app-professional" required>
                        <option value="Manu">Manu (Oftalmología)</option>
                        <option value="Ina">Ina (Fonoaudiología)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Nombre del Paciente *</label>
                    <input type="text" id="patient-name" required placeholder="Ej. Rodrigo Morales">
                </div>
                <div class="form-group">
                    <label>Teléfono de Contacto *</label>
                    <input type="tel" id="patient-phone" required placeholder="+56 9 1234 5678">
                </div>
                <div class="form-group">
                    <label>Prestación *</label>
                    <select id="service-type" required>
                        <option value="Consulta Oftalmológica">Consulta Oftalmológica</option>
                        <option value="Evaluación de Estrabismo">Evaluación de Estrabismo</option>
                        <option value="Terapia de Estrabismo / Visión">Terapia de Estrabismo / Visión</option>
                        <option value="Consulta Fonoaudiológica">Consulta Fonoaudiológica</option>
                        <option value="Evaluación del Lenguaje">Evaluación del Lenguaje</option>
                        <option value="Terapia del Lenguaje">Terapia del Lenguaje</option>
                        <option value="Terapia Vestibular">Terapia Vestibular</option>
                        <option value="Atención a Domicilio">Atención a Domicilio</option>
                    </select>
                </div>
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Fecha *</label>
                        <input type="date" id="app-date" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Hora Inicio *</label>
                        <select id="app-time" required></select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Duración *</label>
                        <select id="duration" required>
                            <option value="20">20 min (1 cupo)</option>
                            <option value="40" selected>40 min (2 cupos)</option>
                            <option value="60">60 min (3 cupos)</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Estado de la Cita *</label>
                    <select id="app-status" required>
                        <option value="Pendiente">Pendiente</option>
                        <option value="Confirmado">Confirmado</option>
                        <option value="Reagendado">Reagendado</option>
                        <option value="NoAsistio">No Asistió</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Observaciones / Notas Clínicas</label>
                    <textarea id="observations" rows="2" placeholder="Motivo de consulta..."></textarea>
                </div>
                <button type="submit" class="btn-new" style="width: 100%;"><i class="fas fa-save"></i> Guardar Cita</button>
            </form>
        </div>
    </div>

    <script>
        const DEFAULT_PASS = "Perceptum2026";
        
        // --- CONFIGURACIÓN DE SINCRONIZACIÓN ---
        const JSONBIN_BIN_ID = "6a9a5075da38895dfe36e52f"; 
        const JSONBIN_API_KEY = "$2a$10$f.n56cI8As3TIWkGah7ZZ.DzNTsWgX8/RpWig2WafjRwlxzvpmh9e"; 
        // --------------------------------------

        let currentProfile = "Manu";
        let appointmentsList = JSON.parse(localStorage.getItem('perceptum_appointments')) || [];
        
        const timeSlots = [];
        let h = 9, m = 0;
        while (h < 18 || (h === 18 && m <= 20)) {
            timeSlots.push(`${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`);
            m += 20;
            if (m >= 60) { m = 0; h++; }
        }

        function formatDate(d) {
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        document.getElementById('week-selector').value = formatDate(new Date());
        populateTimeSelect();
        
        // Cargar citas desde la nube al iniciar
        loadCloudData();
        // Sincronizar automáticamente cada 20 segundos
        setInterval(loadCloudData, 20000);

        async function loadCloudData() {
            if(!JSONBIN_BIN_ID || JSONBIN_BIN_ID === "AQUI_TU_BIN_ID") {
                updateSyncStatus("Local (Sin Nube)", "#94A3B8");
                renderWeeklyGrid();
                return;
            }

            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': JSONBIN_API_KEY }
                });
                if (response.ok) {
                    const data = await response.json();
                    if (Array.isArray(data.record)) {
                        if (appointmentsList.length > 0 && (data.record.length === 0 || (data.record.length === 1 && data.record[0].status === "test"))) {
                            syncToCloud();
                        } else {
                            appointmentsList = data.record;
                            localStorage.setItem('perceptum_appointments', JSON.stringify(appointmentsList));
                        }
                        updateSyncStatus("Sincronizado", "#10B981");
                        renderWeeklyGrid();
                    }
                } else {
                    updateSyncStatus("Error Sinc.", "#E63946");
                }
            } catch (e) {
                updateSyncStatus("Modo Offline", "#F59E0B");
            }
        }

        async function syncToCloud() {
            localStorage.setItem('perceptum_appointments', JSON.stringify(appointmentsList));
            
            if(!JSONBIN_BIN_ID || JSONBIN_BIN_ID === "AQUI_TU_BIN_ID") return;

            updateSyncStatus("Guardando...", "#3B82F6");
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': JSONBIN_API_KEY
                    },
                    body: JSON.stringify(appointmentsList)
                });
                if (response.ok) {
                    updateSyncStatus("Sincronizado", "#10B981");
                } else {
                    updateSyncStatus("Error al Guardar", "#E63946");
                }
            } catch (e) {
                updateSyncStatus("Guardado Local", "#F59E0B");
            }
        }

        function updateSyncStatus(text, color) {
            const badge = document.getElementById('sync-status');
            badge.style.color = color;
            badge.innerHTML = `<i class="fas fa-cloud"></i> ${text}`;
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('sidebar-overlay').classList.toggle('active');
        }

        function populateTimeSelect() {
            document.getElementById('app-time').innerHTML = timeSlots.map(t => `<option value="${t}">${t}</option>`).join('');
        }

        function checkAccess() {
            if(document.getElementById('access-code').value === DEFAULT_PASS) {
                document.getElementById('login-overlay').style.display = 'none';
                renderWeeklyGrid();
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        function setProfile(prof) {
            currentProfile = prof;
            document.getElementById('btn-manu').classList.toggle('active', prof === 'Manu');
            document.getElementById('btn-ina').classList.toggle('active', prof === 'Ina');
            document.getElementById('app-professional').value = prof;
            document.getElementById('agenda-title').innerHTML = `<i class="fas fa-calendar-alt" style="color: var(--primary);"></i> Agenda - ${prof}`;
            
            toggleSidebar();
            renderWeeklyGrid();
        }

        function openAppointmentModal() {
            document.getElementById('editing-id').value = '';
            document.getElementById('modal-title').innerHTML = `<i class="fas fa-calendar-plus"></i> Agendar Cita`;
            document.getElementById('appointment-form').reset();
            document.getElementById('app-professional').value = currentProfile;
            document.getElementById('app-date').value = document.getElementById('week-selector').value;
            document.getElementById('app-status').value = 'Pendiente';
            
            if (document.getElementById('sidebar').classList.contains('active')) {
                toggleSidebar();
            }
            document.getElementById('appointment-modal').style.display = 'flex';
        }

        function editAppointment(id) {
            const app = appointmentsList.find(a => a.id === id);
            if (!app) return;

            document.getElementById('editing-id').value = app.id;
            document.getElementById('modal-title').innerHTML = `<i class="fas fa-edit"></i> Editar Cita`;
            document.getElementById('app-professional').value = app.professional;
            document.getElementById('patient-name').value = app.name;
            document.getElementById('patient-phone').value = app.phone;
            document.getElementById('service-type').value = app.service;
            document.getElementById('app-date').value = app.date;
            document.getElementById('app-time').value = app.time;
            document.getElementById('duration').value = app.duration;
            document.getElementById('app-status').value = app.status || 'Pendiente';
            document.getElementById('observations').value = app.notes || '';

            document.getElementById('appointment-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('appointment-modal').style.display = 'none';
        }

        function saveAppointment(e) {
            e.preventDefault();
            
            const editingId = document.getElementById('editing-id').value;
            const appUniqueId = editingId ? Number(editingId) : Date.now();

            const newApp = {
                id: appUniqueId,
                professional: document.getElementById('app-professional').value,
                name: document.getElementById('patient-name').value,
                phone: document.getElementById('patient-phone').value,
                service: document.getElementById('service-type').value,
                date: document.getElementById('app-date').value,
                time: document.getElementById('app-time').value,
                duration: parseInt(document.getElementById('duration').value),
                status: document.getElementById('app-status').value,
                notes: document.getElementById('observations').value
            };

            const slotsNecesarios = newApp.duration / 20;
            const idxInicio = timeSlots.indexOf(newApp.time);
            
            if (idxInicio === -1 || idxInicio + slotsNecesarios > timeSlots.length) {
                alert("La cita excede el horario disponible.");
                return;
            }

            for (let i = 0; i < slotsNecesarios; i++) {
                const currentSlot = timeSlots[idxInicio + i];
                const existeOcupacion = appointmentsList.some(a => {
                    if (a.id === newApp.id || a.professional !== newApp.professional || a.date !== newApp.date) return false;
                    const aIdx = timeSlots.indexOf(a.time);
                    const aSlots = a.duration / 20;
                    return (idxInicio + i >= aIdx && idxInicio + i < aIdx + aSlots);
                });

                if (existeOcupacion) {
                    alert(`El horario de las ${currentSlot} ya está ocupado.`);
                    return;
                }
            }

            if (editingId) {
                const idx = appointmentsList.findIndex(a => a.id === appUniqueId);
                if (idx !== -1) appointmentsList[idx] = newApp;
            } else {
                appointmentsList.push(newApp);
            }

            closeModal();
            renderWeeklyGrid();
            syncToCloud();
        }

        function deleteAppointment(id) {
            if(confirm("¿Seguro que deseas eliminar esta cita?")) {
                appointmentsList = appointmentsList.filter(a => a.id !== id);
                renderWeeklyGrid();
                syncToCloud();
            }
        }

        function parseLocalDate(dateVal) {
            if (typeof dateVal === 'string' && dateVal.includes('-')) {
                const parts = dateVal.split('-');
                return new Date(parts[0], parts[1] - 1, parts[2]);
            }
            return new Date(dateVal);
        }

        function getMonday(d) {
            d = parseLocalDate(d);
            let day = d.getDay();
            let diff = d.getDate() - day + (day === 0 ? -6 : 1); 
            return new Date(d.getFullYear(), d.getMonth(), diff);
        }

        function renderWeeklyGrid() {
            const container = document.getElementById('grid-container');
            const selectedValue = document.getElementById('week-selector').value;
            const monday = getMonday(selectedValue);

            const weekDays = [];
            const dayNames = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
            for(let i = 0; i < 6; i++) {
                let day = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
                weekDays.push({
                    name: dayNames[i],
                    dateStr: formatDate(day),
                    label: `${dayNames[i]} ${day.getDate()}/${day.getMonth()+1}`
                });
            }

            const filteredApps = appointmentsList.filter(a => a.professional === currentProfile);

            let html = `<div class="grid-header time-col"><i class="far fa-clock"></i></div>`;
            weekDays.forEach(wd => { html += `<div class="grid-header">${wd.label}</div>`; });

            const occupied = {};

            timeSlots.forEach((slot, slotIdx) => {
                html += `<div class="time-slot-label">${slot}</div>`;
                
                weekDays.forEach(wd => {
                    const key = `${wd.dateStr}_${slot}`;
                    if (occupied[key]) return;

                    const app = filteredApps.find(a => a.date === wd.dateStr && a.time === slot);

                    if (app) {
                        const slotsSpan = (app.duration || 20) / 20;
                        for (let i = 0; i < slotsSpan; i++) {
                            const nextSlot = timeSlots[slotIdx + i];
                            if (nextSlot) occupied[`${wd.dateStr}_${nextSlot}`] = true;
                        }

                        const statusText = app.status || 'Pendiente';
                        const statusLabel = statusText === 'NoAsistio' ? 'No Asistió' : statusText;

                        html += `<div class="grid-cell" style="grid-row: span ${slotsSpan};">
                            <div class="slot-card">
                                <div>
                                    <div class="slot-header">
                                        <span class="slot-time"><i class="far fa-clock"></i> ${app.time} (${app.duration}m)</span>
                                        <span class="status-badge status-${statusText}">${statusLabel}</span>
                                    </div>
                                    <div class="slot-patient">${app.name}</div>
                                    <div class="slot-service">${app.service}</div>
                                </div>
                                <div class="slot-actions">
                                    <button type="button" class="btn-mini" onclick="editAppointment(${app.id})" title="Editar Cita"><i class="fas fa-pen" style="color:var(--primary);"></i></button>
                                    <a class="btn-mini" href="https://wa.me/${app.phone.replace(/[^0-9]/g, '')}" target="_blank" title="WhatsApp"><i class="fab fa-whatsapp" style="color:#25D366;"></i></a>
                                    <button type="button" class="btn-mini" onclick="deleteAppointment(${app.id})" title="Eliminar"><i class="fas fa-trash" style="color:var(--danger);"></i></button>
                                </div>
                            </div>
                        </div>`;
                    } else {
                        html += `<div class="grid-cell"></div>`;
                    }
                });
            });

            container.innerHTML = html;
        }
    </script>
</body>
</html>
